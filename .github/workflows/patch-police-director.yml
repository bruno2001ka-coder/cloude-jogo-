name: Ajuste diretor da policia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-police-director.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar limites, equipes e escalonamento
        shell: python
        run: |
          from pathlib import Path

          def troca(s, old, new, nome):
              if old not in s:
                  raise SystemExit(f'{nome}: marcador nao encontrado')
              return s.replace(old, new, 1)

          # ===== POLICIA A PE =====
          p = Path('src/Police.js')
          s = p.read_text(encoding='utf-8')

          s = troca(s,
              "const EFETIVO_BASE=4,POLICIAIS_MAX=8;",
              "const EFETIVO_BASE=3,POLICIAIS_MAX=6;\n// Teto TOTAL em campo por intensidade. Nível zero é ronda normal; batida/abordagem têm teto próprio\n// em `tetoDoNivel`. Assim a favela continua viva sem virar uma enxurrada de fardados.\nconst LIMITE_POR_NIVEL=[3,5,5,6,6,6];",
              'limites de efetivo')

          s = troca(s,
              "const REPOSICAO_ESPERA=12,CALMARIA=20;",
              "const REPOSICAO_ESPERA=18,CALMARIA=25;",
              'cooldown de reforco')

          old_heli = """      }else{\n        heli.position.x=THREE.MathUtils.lerp(heli.position.x,alvo.x,1-Math.exp(-4*dt));\n        heli.position.z=THREE.MathUtils.lerp(heli.position.z,alvo.z,1-Math.exp(-4*dt));\n        heli.rotation.z=THREE.MathUtils.lerp(heli.rotation.z,0,1-Math.exp(-5*dt));\n        const chao=obterElevacao(alvo.x,alvo.z);\n        heli.position.y=THREE.MathUtils.lerp(heli.position.y,chao+HELI_ALTURA_POUSO,1-Math.exp(-2.5*dt));\n        if(Math.abs(heli.position.y-(chao+HELI_ALTURA_POUSO))<.35){policia.heliPousado=true;desembarcarPoliciais(agora)}\n      }\n"""
          new_heli = """      }else{\n        // O helicóptero é OLHO, não transporte de tropa. Antes ele descia até o chão e ainda soltava\n        // mais dois policiais por cima da guarnição da viatura, furando qualquer teto de efetivo.\n        // Agora ele paira alto marcando a ocorrência; quem chega no chão vem pela rua.\n        heli.position.x=THREE.MathUtils.lerp(heli.position.x,alvo.x,1-Math.exp(-4*dt));\n        heli.position.z=THREE.MathUtils.lerp(heli.position.z,alvo.z,1-Math.exp(-4*dt));\n        heli.rotation.z=THREE.MathUtils.lerp(heli.rotation.z,0,1-Math.exp(-5*dt));\n        heli.position.y=THREE.MathUtils.lerp(heli.position.y,HELI_ALTURA_APONTANDO,1-Math.exp(-2.5*dt));\n        policia.heliPousado=false;\n      }\n"""
          s = troca(s, old_heli, new_heli, 'helicoptero sem desembarque')

          old_desembarque = """  let saiu=0;\n  pontoDaViatura={x:ponto.x,z:ponto.z};\n  for(let i=policia.equipeViatura;i<VIATURA_EQUIPE;i++){\n    // Um de cada lado do carro, e não os dois no mesmo pixel.\n    const ang=i?Math.PI:0;\n    const pol=sairDaBase(performance.now()/1000,\n      {x:ponto.x+Math.cos(ang)*1.6,z:ponto.z+Math.sin(ang)*1.6});\n    pol.tipo='desembarque';pol.modo='desembarque';\n    pol.destinoRonda={x:centro.x,z:centro.z};\n    equipeDaViatura.push(pol);\n    saiu++;\n  }\n  policia.equipeViatura=VIATURA_EQUIPE;\n"""
          new_desembarque = """  let saiu=0;\n  pontoDaViatura={x:ponto.x,z:ponto.z};\n  // A viatura não cria gente além do teto da ocorrência. Se já há policiais suficientes na área,\n  // ela continua ajudando com o carro, mas não materializa uma nova dupla.\n  const vagas=Math.max(0,tetoDoNivel()-vivosEmCampo());\n  const limite=Math.min(VIATURA_EQUIPE,policia.equipeViatura+vagas);\n  for(let i=policia.equipeViatura;i<limite;i++){\n    // Um de cada lado do carro, e não os dois no mesmo pixel.\n    const ang=i?Math.PI:0;\n    const pol=sairDaBase(performance.now()/1000,\n      {x:ponto.x+Math.cos(ang)*1.6,z:ponto.z+Math.sin(ang)*1.6});\n    pol.tipo='desembarque';pol.modo='desembarque';\n    pol.destinoRonda={x:centro.x,z:centro.z};\n    equipeDaViatura.push(pol);\n    saiu++;\n  }\n  policia.equipeViatura+=saiu;\n"""
          s = troca(s, old_desembarque, new_desembarque, 'teto no desembarque da viatura')

          old_efetivo = """// Quantos DEVEM estar em campo. É a regra do reforço inteira: quatro sempre, mais um por policial que\n// o jogador derrubou, até o teto. Sem baixa, o efetivo não muda — reforço tem que ter causa.\nfunction efetivoDesejado(){return Math.min(POLICIAIS_MAX,EFETIVO_BASE+policia.baixas);}\n"""
          new_efetivo = """// Diretor de ocorrência: um único lugar decide quantos policiais podem existir.\nfunction vivosEmCampo(){return policiais.reduce((n,p)=>n+(p.vivo?1:0),0)}\nfunction tetoDoNivel(){\n  if(policia.alvoPlantacao||policia.alvoPlanta)return Math.min(POLICIAIS_MAX,5);\n  if(abordagem.ativa)return Math.min(POLICIAIS_MAX,4);\n  const nivel=Math.max(0,Math.min(PROCURADO_MAX,policia.procurado));\n  return Math.min(POLICIAIS_MAX,LIMITE_POR_NIVEL[nivel]??EFETIVO_BASE);\n}\n// A dupla da viatura conta dentro do efetivo, e baixas só podem pedir até dois substitutos.\n// Isso impede a antiga cascata: 4 da ronda + 2 do heli + 2 da viatura + reposições.\nfunction efetivoDesejado(){\n  const equipe=equipeDaViatura.reduce((n,p)=>n+(p.vivo&&policiais.includes(p)?1:0),0);\n  return Math.min(tetoDoNivel(),EFETIVO_BASE+equipe+Math.min(2,policia.baixas));\n}\n"""
          s = troca(s, old_efetivo, new_efetivo, 'diretor de efetivo')

          p.write_text(s, encoding='utf-8')

          # ===== VIATURAS =====
          p = Path('src/Viatura.js')
          s = p.read_text(encoding='utf-8')

          s = troca(s,
              "const CHEGOU=2,PERSEGUICAO_DUAS=3;",
              "const CHEGOU=2,PERSEGUICAO_DUAS=4;",
              'segunda viatura so em nivel alto')

          s = troca(s,
              "const PERSEGUICAO_RECALCULA=.70,INTERCEPTA_MAX=4.0,ALVO_VEL_MAX=11;",
              "const PERSEGUICAO_RECALCULA=.80,INTERCEPTA_MAX=4.0,ALVO_VEL_MAX=11;\nconst DESPACHO_INTERVALO=9,REPLANEJAR_ALVO_DESVIO=1.8;",
              'ritmo de despacho e replanejamento')

          s = troca(s,
              "    rotaDinamica:null,sRota:0,baseU:u0,semAcesso:false,modoBusca:false,retornando:false,rumoSuave:null};",
              "    rotaDinamica:null,sRota:0,baseU:u0,semAcesso:false,modoBusca:false,retornando:false,rumoSuave:null,\n    proximoPlano:performance.now()/1000+u0*.25,ultimoAlvoPlano:null,papelDespacho:'ronda'};",
              'estado do planejamento por viatura')

          s = troca(s,
              "let amostraAlvo=null,relogioPlano=0;",
              "let amostraAlvo=null,proximoDespacho=0;",
              'relogio global antigo')

          s = troca(s,
              "  const d=Math.hypot(alvo.x-v.grupo.position.x,alvo.z-v.grupo.position.z),lead=Math.min(INTERCEPTA_MAX,d/Math.max(6,VEL_ATENDENDO));",
              "  const d=Math.hypot(alvo.x-v.grupo.position.x,alvo.z-v.grupo.position.z);\n  const extra=v.papelDespacho==='bloqueio'?1.25:0;\n  const lead=Math.min(INTERCEPTA_MAX+extra,d/Math.max(6,VEL_ATENDENDO)+extra);",
              'segunda viatura intercepta adiante')

          s = troca(s,
              "  let desembarque=null;relogioPlano=Math.max(0,relogioPlano-dt);",
              "  let desembarque=null;const agora=performance.now()/1000;",
              'tempo local da viatura')

          s = troca(s,
              "    amostraAlvo=null;\n    for(const v of despachadas){if(v.rotaDinamica&&!v.retornando)tentarVoltarAoAnel(v);v.atendendo=false}\n    despachadas.length=0;",
              "    amostraAlvo=null;proximoDespacho=0;\n    for(const v of despachadas){if(v.rotaDinamica&&!v.retornando)tentarVoltarAoAnel(v);v.atendendo=false;v.ultimoAlvoPlano=null;v.papelDespacho='ronda'}\n    despachadas.length=0;",
              'limpeza do despacho')

          old_dispatch = """  if(alvo&&despachadas.length<querem){\n    const destino=uMaisPerto(alvo);let escolhida=null,melhor=Infinity;\n    for(const v of viaturas){if(despachadas.includes(v))continue;const d=v.rotaDinamica?Math.hypot(v.grupo.position.x-alvo.x,v.grupo.position.z-alvo.z):faltaAte(v.u,destino);if(d<melhor){melhor=d;escolhida=v}}\n    if(escolhida){escolhida.destino=destino;escolhida.baseU=escolhida.u;escolhida.retornando=false;despachadas.push(escolhida)}\n  }\n"""
          new_dispatch = """  // Não manda duas viaturas no mesmo segundo. A primeira responde; a segunda, só em ficha alta e\n  // depois de um intervalo, entra como bloqueio/interceptação em vez de formar um comboio colado.\n  if(alvo&&despachadas.length<querem&&agora>=proximoDespacho){\n    const destino=uMaisPerto(alvo);let escolhida=null,melhor=Infinity;\n    for(const v of viaturas){if(despachadas.includes(v))continue;const d=v.rotaDinamica?Math.hypot(v.grupo.position.x-alvo.x,v.grupo.position.z-alvo.z):faltaAte(v.u,destino);if(d<melhor){melhor=d;escolhida=v}}\n    if(escolhida){\n      escolhida.destino=destino;escolhida.baseU=escolhida.u;escolhida.retornando=false;\n      escolhida.papelDespacho=despachadas.length?'bloqueio':'principal';\n      escolhida.proximoPlano=0;escolhida.ultimoAlvoPlano=null;\n      despachadas.push(escolhida);proximoDespacho=agora+DESPACHO_INTERVALO;\n    }\n  }\n"""
          s = troca(s, old_dispatch, new_dispatch, 'despacho escalonado')

          old_plan = """  const velAlvo=atualizarVelocidadeAlvo(alvo);\n  if(alvo&&despachadas.length&&relogioPlano<=0){\n    for(const v of despachadas)planejar(v,alvo,alvo.perseguicao?velAlvo:{x:0,z:0});\n    relogioPlano=alvo.perseguicao?PERSEGUICAO_RECALCULA:.8;\n  }\n"""
          new_plan = """  const velAlvo=atualizarVelocidadeAlvo(alvo);\n  if(alvo&&despachadas.length){\n    // No máximo UMA busca pesada de rota por quadro. Cada carro tem relógio e memória próprios; se o\n    // alvo mal saiu do lugar, mantém a rota atual em vez de refazer A* por rotina.\n    let planejou=false;\n    for(const v of despachadas){\n      if(planejou||agora<v.proximoPlano)continue;\n      const limiar=alvo.quente===false?3.5:REPLANEJAR_ALVO_DESVIO;\n      const mudou=!v.ultimoAlvoPlano||Math.hypot(v.ultimoAlvoPlano.x-alvo.x,v.ultimoAlvoPlano.z-alvo.z)>=limiar;\n      if(!mudou&&v.rotaDinamica&&!v.semAcesso)continue;\n      planejar(v,alvo,alvo.perseguicao?velAlvo:{x:0,z:0});\n      v.ultimoAlvoPlano={x:alvo.x,z:alvo.z};\n      v.proximoPlano=agora+(alvo.perseguicao?PERSEGUICAO_RECALCULA:.95);\n      planejou=true;\n    }\n  }\n"""
          s = troca(s, old_plan, new_plan, 'replanejamento distribuido')

          p.write_text(s, encoding='utf-8')

      - name: Validar jogo
        run: |
          npm run check
          npm test
      - name: Commit
        run: |
          git config user.name "OpenAI GitHub"
          git config user.email "actions@users.noreply.github.com"
          git add src/Police.js src/Viatura.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: control police population and coordinated response"
          git push
