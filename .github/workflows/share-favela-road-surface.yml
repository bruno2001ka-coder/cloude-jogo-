name: Share favela road surface
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/share-favela-road-surface.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export proven favela road builders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/Favela.js')
          s=p.read_text()
          old1='function fitaDaVia(curva,largura,terra=false){'
          old2='function meioFioDaVia(curva,largura){'
          assert old1 in s, 'fitaDaVia marker not found'
          assert old2 in s, 'meioFioDaVia marker not found'
          s=s.replace(old1,'export function fitaDaVia(curva,largura,terra=false){',1)
          s=s.replace(old2,'export function meioFioDaVia(curva,largura){',1)
          p.write_text(s)
          PY
      - name: Validate
        run: npm run check && npm test
      - name: Commit shared road builders
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Favela.js
          git commit -m "refactor: share proven favela road surface"
          git push
