name: Fix noble district syntax
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-noble-district.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch duplicate matrix identifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/NobleDistrict.js')
          s=p.read_text()
          old="let k=0;const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(1,1,1),pos=new THREE.Vector3(),ey=new THREE.Vector3(0,1,0);"
          new="let k=0;const m42=new THREE.Matrix4(),q2=new THREE.Quaternion(),sc2=new THREE.Vector3(1,1,1),pos2=new THREE.Vector3(),ey2=new THREE.Vector3(0,1,0);"
          assert old in s, 'duplicate declaration marker not found'
          s=s.replace(old,new,1)
          old2="const x=p.x+nx*lado*(largura/2-.28),z=p.z+nz*lado*(largura/2-.28);q.setFromAxisAngle(ey,Math.atan2(t.x,t.z));\n    pos.set(x,hRua(x,z)+.018,z);m4.compose(pos,q,sc);grelhas.setMatrixAt(k++,m4);"
          new2="const x=p.x+nx*lado*(largura/2-.28),z=p.z+nz*lado*(largura/2-.28);q2.setFromAxisAngle(ey2,Math.atan2(t.x,t.z));\n    pos2.set(x,hRua(x,z)+.018,z);m42.compose(pos2,q2,sc2);grelhas.setMatrixAt(k++,m42);"
          assert old2 in s, 'grate matrix marker not found'
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate
        run: npm run check && npm test
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NobleDistrict.js
          git commit -m "fix: validate noble district geometry"
          git push
