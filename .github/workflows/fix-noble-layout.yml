name: Fix noble district layout
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_noble_layout.py'
      - '.github/workflows/fix-noble-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply calculated layout repair
        run: python scripts/fix_noble_layout.py
      - name: Validate
        run: npm run check && npm test
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NobleDistrict.js
          git commit -m "fix: calculate noble district lots before building"
          git push
