name: Integrar casa do jogador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-player-house.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar casa ao inicio do jogo
        shell: python
        run: |
          from pathlib import Path
          import json

          def troca(s, old, new, nome):
              if old not in s:
                  raise SystemExit(f'{nome}: marcador nao encontrado')
              return s.replace(old, new, 1)

          # Corrige pai da janela no modulo recem-criado.
          p=Path('src/CasaJogador.js')
          s=p.read_text(encoding='utf-8')
          s=troca(s,
            "peca(new THREE.BoxGeometry(.04,1.0,1.45),vidro,p.x,PISO+1.55,p.z,GIRO,false,false)",
            "peca(new THREE.BoxGeometry(.04,1.0,1.45),vidro,p.x,PISO+1.55,p.z,GIRO,grupo,false)",
            'janela da casa')
          p.write_text(s,encoding='utf-8')

          # Carrega a casa depois do WorldGenerator: o plato ja existe e a casa entra no mesmo sistema
          # de portas/casas ocas usado pela Economy.
          p=Path('src/main.js')
          s=p.read_text(encoding='utf-8')
          s=troca(s,
            "import{atualizarAnimais,atualizarPortas}from'./WorldGenerator.js';",
            "import{atualizarAnimais,atualizarPortas}from'./WorldGenerator.js';\nimport{posicionarJogadorNaCasa}from'./CasaJogador.js';",
            'import da casa')
          s=troca(s,
            "const VERSAO_JOGO='2026-09-09-viatura-interceptacao-v3';",
            "const VERSAO_JOGO='2026-09-09-casa-jogador-v1';",
            'versao visivel')
          old="""// Sem save, `carregar()` devolve false e o jogo começa do zero — sem caso especial nenhum.
if(carregar())console.info('Quintal 3D: progresso carregado.');
else if(!saveDisponivel())console.info('Quintal 3D: sem armazenamento — o progresso não será salvo.');
instalarSalvamentoAoSair();
"""
          new="""// Sem save, o jogador começa em CASA. Save antigo continua exatamente na posição salva.
const carregouSave=carregar();
if(carregouSave)console.info('Quintal 3D: progresso carregado.');
else{
  posicionarJogadorNaCasa(player);
  console.info('Quintal 3D: nova partida iniciada na casa do jogador.');
  if(!saveDisponivel())console.info('Quintal 3D: sem armazenamento — o progresso não será salvo.');
}
instalarSalvamentoAoSair();
"""
          s=troca(s,old,new,'spawn de nova partida')
          p.write_text(s,encoding='utf-8')

          # Release.
          p=Path('package.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['version']='0.3.2'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Validar jogo
        run: |
          npm run check
          npm test
      - name: Commit
        run: |
          git config user.name "OpenAI GitHub"
          git config user.email "actions@users.noreply.github.com"
          git add src/CasaJogador.js src/main.js package.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: add player home and new-game spawn"
          git push
